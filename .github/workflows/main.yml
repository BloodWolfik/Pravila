name: Update Clash Rules

on:
  schedule:
    # Запуск каждый день в 03:00 по UTC (06:00 по МСК)
    - cron: '0 3 * * *'
  workflow_dispatch: # Кнопка для ручного запуска проверки

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download or update YAML files
        run: |
          curl -fsSL "https://raw.githubusercontent.com/BloodWolfik/Pravila/refs/heads/main/my_rules.yaml" -o my_rules.yaml
          curl -fsSL "https://raw.githubusercontent.com/BloodWolfik/Pravila/refs/heads/main/my_rules_cf.yaml" -o my_rules_cf.yaml

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add my_rules.yaml my_rules_cf.yaml
          git diff --staged --quiet || (git commit -m "chore: update rules" && git push)
